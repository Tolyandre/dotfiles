<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Home Page</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f4f4f4;
            --card-bg: #ffffff;
            --text: #333333;
            --btn-bg: #007BFF;
            --btn-hover: #0056b3;
            --btn-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --card-bg: #1e1e1e;
                --text: #e0e0e0;
                --btn-bg: #0d84ff;
                --btn-hover: #339dff;
                --shadow: rgba(0, 0, 0, 0.6);
            }
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px var(--shadow);
        }

        h1 {
            color: var(--text);
        }

        a {
            display: block;
            margin: 20px 0;
            padding: 10px 20px;
            text-decoration: none;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to my Self-Hosted Server</h1>
        <a href="https://immich.toly.is-cool.dev">Immich</a>
        <a href="https://open-webui.toly.is-cool.dev">Open WebUI</a>
        <a href="https://nextcloud.toly.is-cool.dev">Owncloud</a>
        <a href="./guacamole">Guacamole</a>
        <a href="./music">Navidrome</a>
        <a href="./elo">Board Game Elo</a>
        <a href="./elo-stage">Board Game Elo Stage</a>
    </div>
</body>

</html>
